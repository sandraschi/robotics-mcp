[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[project]
name = "robotics-mcp"
version = "0.2.1"
description = "Unified robotics control via MCP - Physical and virtual robots (bot + vbot)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Sandra Schipal", email = "sandraschipal@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware"
]
keywords = ["robotics", "mcp", "ros", "unity", "vrchat", "virtual-robotics", "fastmcp", "moorebot", "unitree"]

dependencies = [
    "fastmcp>=3.4.4,<4",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.23.0",
    "structlog>=23.0.0",
    "python-osc>=1.8.0",
    "pyserial>=3.5",
    "requests>=2.31.0",
    "paho-mqtt>=1.6.1",
    "pycryptodome>=3.20.0",
    "cryptography>=42.0.0",
    "Pillow>=10.0.0",
    "py-mini-racer>=0.6.0",
    "phue>=1.1",
    "roslibpy>=1.2.0",
    "numpy>=1.24.0",
    "prefab-ui>=0.14.0",
]

[project.optional-dependencies]
ros = [
    "scipy>=1.10.0",
    "opencv-python>=4.8.0",
    "matplotlib>=3.7.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.16.0,<0.17",
    "mypy>=1.5.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "pre-commit>=4.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.22.0",
]

[project.urls]
"Homepage" = "https://github.com/sandraschi/robotics-mcp"
"Bug Reports" = "https://github.com/sandraschi/robotics-mcp/issues"
"Source" = "https://github.com/sandraschi/robotics-mcp"
"Documentation" = "https://github.com/sandraschi/robotics-mcp/blob/main/README.md"

[project.scripts]
robotics-mcp = "robotics_mcp.server:main"
raspbot-setup = "robotics_mcp.scripts.raspbot_setup:main"

[tool.hatch.build.targets.wheel]
packages = ["src/robotics_mcp"]

[tool.uv-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --strict-markers --cov=robotics_mcp --cov-report=term-missing --cov-report=html"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "requires_hardware: marks tests that require physical hardware",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/robotics_mcp"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    # Vendored / auxiliary trees (not part of the published wheel)
    "Xiaomi-cloud-tokens-extractor",
    "mcpb",
    "_llm_test_scripts",
    "scripts",
    "dreame_auth.py",
    "**/*.bak",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = [
    "S101",
    "B008",
    "E501",
    "S104",
    "S105",
    "S603",
    "S607",
    "S608",
    "S307",
    "S106",
    "S110",
    "S112",
    "RUF012",
    "S324",
    "E402",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S108"]
  "src/robotics_mcp/utils/simulated_data.py" = ["S311"]
  "scripts/cua-webapp-test.py" = ["B007", "S310", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
